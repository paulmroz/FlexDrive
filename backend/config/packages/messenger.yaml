framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    - App\Shared\Infrastructure\Trace\TraceMessengerMiddleware
                    - validation
                    - doctrine_transaction: ['default']
            query.bus:
                middleware:
                    - validation
            event.bus:
                default_middleware:
                    allow_no_handlers: true
                middleware:
                    - App\Shared\Infrastructure\Trace\TraceMessengerMiddleware
                    - App\AuditLog\Infrastructure\Middleware\AuditLogMiddleware

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            sync: 'sync://'
            async_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: domain_events
                        type: topic
                    queues:
                        events_queue: ~
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            async_commands:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: domain_commands
                        type: direct
                    queues:
                        commands_queue: ~
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: dlx
                        type: direct
                    queues:
                        dlq: ~

        routing:
            # Route your messages to the transports
            'App\Car\Application\Command\ProcessChatMessageCommand': async_commands
            'App\AuditLog\Application\Command\CreateAuditLog\CreateAuditLogCommand': async_commands
            'App\Shared\Domain\Event\AuditableEventInterface': async_events

        